version: '3.9'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ultrabarber_crm
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - '4000:4000'
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: mysql://root:root@db:3306/ultrabarber_crm
    restart: unless-stopped
    command: ["npm", "run", "start", "--workspace", "backend"]

volumes:
  db_data:
